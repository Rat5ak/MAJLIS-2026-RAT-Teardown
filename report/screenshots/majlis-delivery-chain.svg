<g fill="#193d40" font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
<text font-size="17" font-weight="600" x="160" y="70">Internet Shortcut</text><text font-size="13" x="160" y="96">WebDAV /secure-docs/3</text>
<text font-size="17" font-weight="600" x="450" y="70">Supplied Shell Link</text><text font-size="13" x="450" y="96">ftp.exe with script input</text>
<text font-size="17" font-weight="600" x="740" y="70">icon.ico: FTP script</text><text font-size="13" x="740" y="96">! local-shell escape</text>
<text font-size="17" font-weight="600" x="450" y="201">res.ico: batch commands into CMD</text><text font-size="13" x="450" y="227">Creates a task and launches an MSI</text>
<text font-size="17" font-weight="600" x="223" y="333">Scheduled command channel</text><text font-size="14" x="223" y="361">gomescareerplans[.]com/docs/</text><text font-size="13" x="223" y="386">HTTP response piped into CMD</text><text font-size="14" font-weight="600" x="223" y="411">Every 39 minutes</text>
<text font-size="17" font-weight="600" x="678" y="333">MSI / native RAT channel</text><text font-size="14" x="678" y="361">www.chestergreenfarming[.]com</text><text font-size="13" x="678" y="386">JSON commands and file transfers</text><text font-size="14" font-weight="600" x="678" y="411">Normal polling every 14-24 seconds</text>
