<svg aria-labelledby="chain-title chain-desc" role="img" viewBox="0 0 900 490" xmlns="http://www.w3.org/2000/svg">
<title id="chain-title">Majlis delivery and the two command channels</title>
<desc id="chain-desc">Internet Shortcut to WebDAV, supplied LNK launching FTP script input, local shell escape to CMD, then a split into a 39-minute scheduled HTTP command task and MSI launching the native RAT, which polls another domain every 14 to 24 seconds. The entry-to-LNK link is reconstructed because the remote resource was unavailable.</desc>
